AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: OFFICE-STATUS - STACK | Stack de CloudFormation para gestion de estado de oficinas en tiempo real con AppSync

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - prod
    Description: Environment name (dev, qa, prod)

Conditions:
  IsProduction: !Equals [!Ref Environment, "prod"]

Resources:
  # SecretManager
  JWTValidationSecret:
    Type: AWS::SecretsManager::Secret
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${AWS::StackName}-jwt-validation
      Description: OFFICE-STATUS - JWT VALIDATION | Secret para validacion de tokens JWT
      GenerateSecretString:
        SecretStringTemplate: '{"secretKey": ""}'
        GenerateStringKey: secretKey

  # IAM Role for CloudWatch Logs
  AppSyncLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-appsync-logging-role
      Description: OFFICE-STATUS - APPSYNC LOGGING | Rol IAM para logging de AppSync en CloudWatch
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-AppSyncCloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/appsync/apis/*

  # GraphQLApi

  AppSyncGraphQLApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub ${AWS::StackName}-appsync
      AuthenticationType: AWS_LAMBDA
      LambdaAuthorizerConfig:
        AuthorizerUri: !GetAtt JWTAuthorizerFunction.Arn
        IdentityValidationExpression: ".*"
      LogConfig:
        FieldLogLevel: ALL  # Options: NONE, ERROR, or ALL
        CloudWatchLogsRoleArn: !GetAtt AppSyncLoggingRole.Arn
      XrayEnabled: true

  AppSyncGraphQLApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/appsync/apis/${AppSyncGraphQLApi.ApiId}
      RetentionInDays: !If [IsProduction, 7, 1]

  # GraphQLSchema

  GraphQLSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      Definition: |
        type Mutation {
          createUser(userId: ID!, officeId: [ID!]): User
          addOfficeUser(userId: ID!, officeId: ID!): User
          createOffice(officeId: ID!, officeName: String!): Office
          statusOffice(officeId: ID!, status: String!): StatusOffice
        }

        type Office {
          officeId: ID!
          officeName: String!
          status: String!
        }

        type StatusOffice {
          officeId: ID!
          status: String!
        }

        type User {
          userId: ID!
          officeId: [ID!]
        }

        type Subscription {
          onCreateOffice: StatusOffice
            @aws_subscribe(mutations: ["statusOffice"])
        }

        type Query {
          getOfficeByID(officeId: ID!): Office
          getOffices: [Office]
        }

        schema {
          query: Query
          mutation: Mutation
          subscription: Subscription
        }

  # LambdaFunction

  JWTAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-jwt-authorizer
      Description: OFFICE-STATUS - JWT AUTHORIZER | Funcion Lambda para autorizacion JWT en AppSync
      Runtime: nodejs22.x
      Handler: index.handler
      CodeUri: src/lambdas/authorizer
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          SECRET_ARN: !GetAtt JWTValidationSecret.Id
          USERS_TABLE_NAME: !Ref UsersTable
          CACHE_TTL: "900000"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref JWTValidationSecret

  JWTAuthorizerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${JWTAuthorizerFunction}
      RetentionInDays: !If [IsProduction, 7, 1]

  # Lambda permision

  AppSyncLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JWTAuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: appsync.amazonaws.com

  # DynamodbTable

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-users
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  OfficesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-offices
      AttributeDefinitions:
        - AttributeName: officeId
          AttributeType: S
      KeySchema:
        - AttributeName: officeId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # Data source

  UsersDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      Name: UsersDataSource
      Description: OFFICE-STATUS - USERS DATASOURCE | Data source de DynamoDB para operaciones de usuarios
      Type: AMAZON_DYNAMODB
      DynamoDBConfig:
        TableName: !Ref UsersTable
        AwsRegion: !Ref AWS::Region
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn

  OfficesDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      Name: OfficesDataSource
      Description: OFFICE-STATUS - OFFICES DATASOURCE | Data source de DynamoDB para operaciones de oficinas
      Type: AMAZON_DYNAMODB
      DynamoDBConfig:
        TableName: !Ref OfficesTable
        AwsRegion: !Ref AWS::Region
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn

  EmptyDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      Name: EmptyDataSource
      Description: OFFICE-STATUS - EMPTY DATASOURCE | Data source vacio para subscriptions
      Type: NONE

  # AppSync Role

  AppSyncServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-appsync-service-role
      Description: OFFICE-STATUS - APPSYNC SERVICE ROLE | Rol IAM para que AppSync acceda a DynamoDB
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-AppSyncDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !GetAtt OfficesTable.Arn

  # Resolver

  CreateUserResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      TypeName: Mutation
      FieldName: createUser
      DataSourceName: !GetAtt UsersDataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2017-02-28",
          "operation": "PutItem",
          "key": {
            "userId": $util.dynamodb.toDynamoDBJson($ctx.arguments.userId)
          },
          "attributeValues": {
            "officeId": $util.dynamodb.toDynamoDBJson($ctx.arguments.officeId),
            "createdAt": $util.dynamodb.toDynamoDBJson($util.time.nowISO8601()),
            "updatedAt": $util.dynamodb.toDynamoDBJson($util.time.nowISO8601())
          },
          "condition": {
            "expression": "attribute_not_exists(userId)",
            "expressionNames": {
              "#userId": "userId"
            }
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result)

  AddOfficeUserResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      TypeName: Mutation
      FieldName: addOfficeUser
      DataSourceName: !GetAtt UsersDataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2017-02-28",
          "operation": "UpdateItem",
          "key": {
            "userId": $util.dynamodb.toDynamoDBJson($ctx.arguments.userId)
          },
          "update": {
            "expression": "SET #officeId = list_append(if_not_exists(#officeId, :empty_list), :officeId)",
            "expressionNames": {
              "#officeId": "officeId"
            },
            "expressionValues": {
              ":officeId": {
                "L": [
                  {
                    "S": "$ctx.arguments.officeId"
                  }
                ]
              },
              ":empty_list": {
                "L": []
              }
            }
          }
        }
      ResponseMappingTemplate: |
        #if($ctx.error)
          $utils.error($ctx.error.message, $ctx.error.type)
        #end
        $util.toJson($ctx.result)

  CreateOfficeResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      TypeName: Mutation
      FieldName: createOffice
      DataSourceName: !GetAtt OfficesDataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2017-02-28",
          "operation": "PutItem",
          "key": {
            "officeId": $util.dynamodb.toDynamoDBJson($ctx.arguments.officeId)
          },
          "attributeValues": {
            "officeName": $util.dynamodb.toDynamoDBJson($ctx.arguments.officeName),
            "status": $util.dynamodb.toDynamoDBJson("offline"),
            "createdAt": $util.dynamodb.toDynamoDBJson($util.time.nowISO8601()),
            "updatedAt": $util.dynamodb.toDynamoDBJson($util.time.nowISO8601())
          },
          "condition": {
            "expression": "attribute_not_exists(officeId)"
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result)

  StatusOfficeResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      TypeName: Mutation
      FieldName: statusOffice
      DataSourceName: !GetAtt OfficesDataSource.Name
      RequestMappingTemplate: |
        #set($isAdmin = $ctx.identity.resolverContext.isAdmin == "true")
        #set($allowedOffices = $util.parseJson($ctx.identity.resolverContext.allowedOffices))
        #set($officeId = $ctx.arguments.officeId)

        #set($status = $ctx.arguments.status)
        #set($validStatuses = ["online", "offline", "busy", "away"])

        #if(!$isAdmin && !$allowedOffices.contains($officeId))
          $util.unauthorized()
        #end

        #if(!$validStatuses.contains($status))
          $util.error("Invalid status. Allowed values: online, offline, busy, away")
        #end

        {
          "version": "2017-02-28",
          "operation": "UpdateItem",
          "key": {
            "officeId": $util.dynamodb.toDynamoDBJson($ctx.arguments.officeId)
          },
          "update": {
            "expression": "SET #status = :status, #updatedAt = :updatedAt",
            "expressionNames": {
              "#status": "status",
              "#updatedAt": "updatedAt"
            },
            "expressionValues": {
              ":status": $util.dynamodb.toDynamoDBJson($ctx.arguments.status),
              ":updatedAt": $util.dynamodb.toDynamoDBJson($util.time.nowISO8601())
            }
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result)

  GetOfficeByIDResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      TypeName: Query
      FieldName: getOfficeByID
      DataSourceName: !GetAtt OfficesDataSource.Name
      RequestMappingTemplate: |
        #set($isAdmin = $ctx.identity.resolverContext.isAdmin == "true")
        #set($allowedOffices = $util.parseJson($ctx.identity.resolverContext.allowedOffices))
        #set($officeId = $ctx.arguments.officeId)

        #if(!$isAdmin && !$allowedOffices.contains($officeId))
          $util.unauthorized()
        #end      
        {
          "version": "2017-02-28",
          "operation": "GetItem",
          "key": {
            "officeId": $util.dynamodb.toDynamoDBJson($ctx.arguments.officeId)
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result)

  GetOfficesResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      TypeName: Query
      FieldName: getOffices
      DataSourceName: !GetAtt OfficesDataSource.Name
      RequestMappingTemplate: |
        #set($isAdmin = $ctx.identity.resolverContext.isAdmin == "true")
        #set($allowedOffices = $util.parseJson($ctx.identity.resolverContext.allowedOffices))
        #set($tableName = $ctx.source.tableName)

        #if($isAdmin)
          {
              "version" : "2017-02-28",
              "operation" : "Scan"
          }
        #else
          #set($ids = [])
          #foreach($id in $allowedOffices)
              #set($map = {})
              $util.qr($map.put("officeId", $util.dynamodb.toString($id)))
              $util.qr($ids.add($map))
          #end

          {
              "version" : "2018-05-29",
              "operation" : "BatchGetItem",
              "tables" : {
                  "$tableName": {
                      "keys": $util.toJson($ids),
                      "consistentRead": true
                  }
              }
          }
        #end
      ResponseMappingTemplate: |
        #if($ctx.error)
          $utils.error($ctx.error.message, $ctx.error.type)
        #end
        #if($isAdmin)
          #set($result = $ctx.result.items)
        #else
          #set($tableName = $ctx.source.tableName)
          #set($result = [])
          #if($ctx.result.data && $ctx.result.data[$tableName])
            #foreach($item in $ctx.result.data[$tableName])
                #if(!$util.isNull($item))
                    $util.qr($result.add($item))
                #end
            #end
          #end
        #end
        $util.toJson($result)


  OnCreateOfficeResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      TypeName: Subscription
      FieldName: onCreateOffice
      DataSourceName: !GetAtt EmptyDataSource.Name
      RequestMappingTemplate: |
        {
            "version": "2017-02-28",
            "payload": {}
        }
      ResponseMappingTemplate: |
        #set($isAdmin = $ctx.identity.resolverContext.isAdmin == "true")
        #if(!$isAdmin && $ctx.identity.resolverContext && $ctx.identity.resolverContext.allowedOffices)
          #set($allowedOffices = $util.parseJson($ctx.identity.resolverContext.allowedOffices))
          #if($allowedOffices && $allowedOffices.size() > 0)
            #set($filter = {
              "officeId": {
                "in": $allowedOffices
              }
            })
            $extensions.setSubscriptionFilter($util.transform.toSubscriptionFilter($filter))
          #end
        #end

        null

Outputs:
  GraphQLApiId:
    Description: OFFICE-STATUS - GRAPHQL API ID | ID de la API GraphQL de AppSync
    Value: !GetAtt AppSyncGraphQLApi.ApiId
    Export:
      Name: !Sub ${AWS::StackName}-graphql-api-id

  GraphQLApiEndpoint:
    Description: OFFICE-STATUS - GRAPHQL API ENDPOINT | Endpoint de la API GraphQL de AppSync
    Value: !GetAtt AppSyncGraphQLApi.GraphQLUrl
    Export:
      Name: !Sub ${AWS::StackName}-graphql-api-endpoint

  GraphQLApiArn:
    Description: OFFICE-STATUS - GRAPHQL API ARN | ARN de la API GraphQL de AppSync
    Value: !GetAtt AppSyncGraphQLApi.Arn
    Export:
      Name: !Sub ${AWS::StackName}-graphql-api-arn

  UsersTableName:
    Description: OFFICE-STATUS - USERS TABLE NAME | Nombre de la tabla DynamoDB de usuarios
    Value: !Ref UsersTable
    Export:
      Name: !Sub ${AWS::StackName}-users-table-name

  OfficesTableName:
    Description: OFFICE-STATUS - OFFICES TABLE NAME | Nombre de la tabla DynamoDB de oficinas
    Value: !Ref OfficesTable
    Export:
      Name: !Sub ${AWS::StackName}-offices-table-name
